<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Resume</title>
<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#edf0ed}
#viewer{width:100%;height:100%;overflow-y:auto;overflow-x:hidden;box-sizing:border-box;background:#fff}
#page{display:block;width:100%;height:auto;background:#fff}
#error{display:none;padding:24px;font:16px Arial,sans-serif;color:#222;background:#fff}
</style>
</head>
<body>
<div id="viewer">
<canvas id="page"></canvas>
<div id="error">Unable to display the resume. Please use the Download Resume button.</div>
</div>
<script type="module">
import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs';
const canvas=document.getElementById('page');
const viewer=document.getElementById('viewer');
const error=document.getElementById('error');
let pdf=null;
async function renderResume(){
 try{
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';
  if(!pdf){
   pdf=await pdfjsLib.getDocument({
    url:new URL('ATS_Jishin_Bijumon_George_Resume_SinglePage.pdf',window.location.href).href
   }).promise;
  }
  const page=await pdf.getPage(1);
  const base=page.getViewport({scale:1});
  const scale=Math.max(0.1,viewer.clientWidth/base.width);
  const viewport=page.getViewport({scale});
  const ratio=window.devicePixelRatio||1;
  canvas.width=Math.ceil(viewport.width*ratio);
  canvas.height=Math.ceil(viewport.height*ratio);
  canvas.style.width=viewport.width+'px';
  canvas.style.height=viewport.height+'px';
  const ctx=canvas.getContext('2d',{alpha:false});
  ctx.save();
  ctx.fillStyle='#fff';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.restore();
  await page.render({canvasContext:ctx,viewport,transform:[ratio,0,0,ratio,0,0]}).promise;
 }catch(e){
  console.error('Resume viewer error:',e);
  canvas.style.display='none';
  error.style.display='block';
 }
}
window.addEventListener('load',renderResume);
let resizeTimer;
window.addEventListener('resize',()=>{
 clearTimeout(resizeTimer);
 resizeTimer=setTimeout(renderResume,150);
});
</script>
</body>
</html>
